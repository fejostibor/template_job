name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy telepítés fusson; a folyamatban lévőt ne szakítsa meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Pages beállítása
        uses: actions/configure-pages@v5
        with:
          # Ha a Pages még nincs bekapcsolva a repóban, ez bekapcsolja.
          enablement: true

      - name: Statikus fájlok csomagolása
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Telepítés
        id: deployment
        uses: actions/deploy-pages@v4
